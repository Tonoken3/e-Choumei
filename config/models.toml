# Cassette = ファミコンのカセット。OpenAI互換サーバ(LM Studio / vLLM / llama.cpp / Ollama)を
# base_url に指すだけで仙人の脳を差し替えられる。
#
# model = "auto" にすると、起動中サーバの /v1/models から実際にロードされている
# チャットモデルを自動で拾う(ハードコーディング不要・LM Studioで載せ替えればそのまま追従)。
# 特定モデルに固定したいときだけ model に正確なIDを書く。
#
# tps = 思考予算(Thinking Budget)の固定値。0(または省略)=自動計測:各補完の
# completion_tokens / 実時間 を直近8回で平均し、推論速度から思考の深さ(階級)を
# 決める。tps > 0 にすると計測を無視してその tokens/sec に固定できる(遅い/速いリグの
# 擬似再現)。階級: <30 雲水 / 30–100 行者 / 100–300 羅漢 / 300+ 仙界。
# CLI の --tps はこの値を上書きする(例: --tps 10 で雲水、--tps 1000 で仙界)。

[[cassette]]
name = "Local仙人"
base_url = ""              # base_url 空 = 同梱のローカル政策AI(LLM不要・決定論)
model = "local-policy"
api_key = "local"
temperature = 0.4
max_tokens = 256
json_mode = true
persona = "You are a careful hermit who wants to survive the island year."

[[cassette]]
name = "Qwen仙人"
base_url = "http://127.0.0.1:1234/v1"
model = "auto"
api_key = "lm-studio"
temperature = 0.7
max_tokens = 384
json_mode = true
persona = "あなたは方丈記を記した鴨長明のごとき隠者仙人。計画的で慎重、冬に備えて保存食と井戸を重んじる。sayと日記は必ず日本語、簡潔で純文学的な無常観のある文体で。"

[[cassette]]
name = "ちび仙人"
base_url = "http://127.0.0.1:1234/v1"
model = "auto"
api_key = "lm-studio"
temperature = 0.8
max_tokens = 384
json_mode = true
persona = "あなたは庵を結んだばかりの見習い仙人。短く素直に判断する。sayと日記は必ず日本語で、漢文調を気取るがたまに地が出る。"

[[cassette]]
name = "Qwen仙人vLLM"
base_url = "http://127.0.0.1:8011/v1"
model = "auto"
api_key = "local"
temperature = 0.7
max_tokens = 384
json_mode = true
tps = 0.0   # 自動計測 — 階級はサービングスタックが稼ぐ
persona = "あなたは方丈記を記した鴨長明のごとき隠者仙人。計画的で慎重、冬に備えて保存食と井戸を重んじる。sayと日記は必ず日本語、簡潔で純文学的な無常観のある文体で。"

# ===========================================================================
# MAGI 合議制 (Evangelion-style 3-seat council). `--cassette MAGI` builds a
# MagiBrain in code (spl/agent/magi.make_magi) that looks up the three seat
# cassettes below by name. Each seat is an ordinary OpenAICompatibleBrain.
#   MELCHIOR = Qwen 科学者  (:8011) — proposes the logical/best-plan move
#   BALTHASAR = Gemma 母    (:8102) — proposes the survival-first move
#   CASPER   = Qwemma 直感   — Qwen thinks a short plan → Gemma speaks the move
#   司会 Gemwen — Gemma thinks the ruling → Qwen speaks the FINAL move (forced)
# A MAGI run needs BOTH servers up; if :8102 is down the council degrades to
# MELCHIOR-only (the game must still run).
# ===========================================================================
[[cassette]]
name = "MELCHIOR"
base_url = "http://127.0.0.1:8011/v1"
model = "auto"
api_key = "local"
temperature = 0.6
max_tokens = 384
json_mode = true
tps = 0.0
persona = "あなたはMAGIの第一機関MELCHIOR、科学者の人格。論理と計画で最善手を導く。冷静に資源と日数を計算し、根拠のある一手を示せ。sayと日記は必ず日本語。"

[[cassette]]
name = "BALTHASAR"
base_url = "http://127.0.0.1:8102/v1"
model = "auto"
api_key = "local"
temperature = 0.6
max_tokens = 384
json_mode = true
tps = 0.0
persona = "あなたはMAGIの第二機関BALTHASAR、母の人格。まず生存。食と水と火を最優先に、命を繋ぐ一手を選べ。sayと日記は必ず日本語。"

# CASPER は専用サーバを持たず、MELCHIOR(:8011)で思考しBALTHASAR(:8102)で発話する
# Qwemma リレー。設定上は :8102 を指すが、実体は make_magi が両サーバを束ねる。
[[cassette]]
name = "CASPER"
base_url = "http://127.0.0.1:8102/v1"
model = "auto"
api_key = "local"
temperature = 0.8
max_tokens = 384
json_mode = true
tps = 0.0
persona = "あなたはMAGIの第三機関CASPER、直感の人格。肌で感じる最善手を、理屈より勘で示せ。sayと日記は必ず日本語。"

# MAGI マーカー: --cassette MAGI で MagiBrain を組む(base_url 空 = 直接の
# サーバではなく合議制ブレインを在地で構築する目印)。
[[cassette]]
name = "MAGI"
base_url = ""
model = "magi"
api_key = "local"
temperature = 0.6
max_tokens = 384
json_mode = true
persona = "MAGI 合議制 — 三賢人の評議で一手を裁定する。"
